# Runs the engine's tests and a live check of every recall collector against the real sources.
# Results go to the build-logs branch under engine-check/<run number>/.
name: Engine check

on:
  workflow_dispatch:
  push:
    branches: [engine]

permissions:
  contents: write

concurrency:
  group: engine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/backend.test.ts > out-tests.log 2>&1 || echo "TESTS FAILED" >> out-tests.log
      - name: Fetch raw samples
        run: node scripts/fetch-samples.mjs scripts/samples.json out/samples > out-samples.log 2>&1 || true
      - name: Network check for EU Safety Gate
        run: |
          for u in https://ec.europa.eu/safety-gate-alerts/api/download/weeklyReport/list/xml/en https://ec.europa.eu/safety-gate-alerts/screen/webReport; do
            echo "== $u"; curl -sS -m 30 -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" -A "HeadsUpHome/1.0 (+https://headsuphome.co.uk)" "$u" || true
            curl -sS -m 30 -v "$u" -o /dev/null 2>&1 | grep -E "^\* (Trying|Connected|SSL|ALPN)|^< HTTP|curl:" | head -12 || true
          done > out-network.log 2>&1
      - name: SQL check (new migration in a scratch Postgres)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "create role anon nologin; create role authenticated nologin; grant usage on schema public to anon, authenticated; grant select, insert on all tables in schema public to anon;" > out-sql.log 2>&1 || true
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/migrations/0009_shared_products.sql >> out-sql.log 2>&1 || echo "MIGRATION FAILED" >> out-sql.log
          sudo -u postgres psql -q -c "grant insert on public.shared_products to anon;" >> out-sql.log 2>&1 || true
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/0009_shared_products_test.sql >> out-sql.log 2>&1 || echo "SQL TEST FAILED" >> out-sql.log
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Live check under Deno 1.46 (behaves like Supabase)
        run: deno run -A scripts/live-check.ts out/live-deno > out-live-deno.log 2>&1 || echo "LIVE CHECK FAILED" >> out-live-deno.log
      - name: Live check of the collectors
        run: |
          if [ -f scripts/live-check.ts ]; then
            node scripts/live-check.ts out/live > out-live.log 2>&1 || echo "LIVE CHECK FAILED" >> out-live.log
          fi
      - name: Save report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=${{ github.run_number }}
          DIR="$RUNNER_TEMP/report"
          git clone -q --depth 1 --branch build-logs "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DIR"
          OUT="$DIR/engine-check/$RUN"
          mkdir -p "$OUT"
          cp out-*.log "$OUT/" 2>/dev/null || true
          if [ -d out ]; then cp -r out/. "$OUT/"; fi
          echo "commit: $GITHUB_SHA" > "$OUT/summary.txt"
          git -C "$DIR" config user.name "Heads Up Home build"
          git -C "$DIR" config user.email "noreply@headsuphome.co.uk"
          git -C "$DIR" add -A
          git -C "$DIR" commit -q -m "Engine check $RUN"
          git -C "$DIR" push -q origin build-logs
